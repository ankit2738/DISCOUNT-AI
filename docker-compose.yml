name: discount-ai

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-discount_ai}
      POSTGRES_USER: ${POSTGRES_USER:-discount}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discount_ai_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-docker}
      SECRET_KEY: ${SECRET_KEY:-change-this-docker-dev-secret-with-32-bytes}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-discount}:${POSTGRES_PASSWORD:-discount_ai_dev}@db:5432/${POSTGRES_DB:-discount_ai}
      REDIS_URL: redis://redis:6379/0
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DEMO_MODE: ${DEMO_MODE:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      AI_PROVIDER: ${AI_PROVIDER:-fallback}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      SMTP_URL: ${SMTP_URL:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-sandbox}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-docker}
      SECRET_KEY: ${SECRET_KEY:-change-this-docker-dev-secret-with-32-bytes}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-discount}:${POSTGRES_PASSWORD:-discount_ai_dev}@db:5432/${POSTGRES_DB:-discount_ai}
      REDIS_URL: redis://redis:6379/0
      DEMO_MODE: ${DEMO_MODE:-true}
      SEED_DEMO_DATA: "false"
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build: ./backend
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-docker}
      SECRET_KEY: ${SECRET_KEY:-change-this-docker-dev-secret-with-32-bytes}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-discount}:${POSTGRES_PASSWORD:-discount_ai_dev}@db:5432/${POSTGRES_DB:-discount_ai}
      REDIS_URL: redis://redis:6379/0
      DEMO_MODE: ${DEMO_MODE:-true}
      SEED_DEMO_DATA: "false"
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
